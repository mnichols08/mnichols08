name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_branch: output
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          extras_css: |
            :root {
              --color-canvas-default: #111111 !important;
              --color-canvas-subtle: #1a1a1a !important;
              --color-border-default: #3e3c20 !important;
              --color-border-muted: #2a2a2a !important;
              --color-fg-default: #ffffff !important;
              --color-fg-muted: #b6b211 !important;
              --color-fg-subtle: #827f2b !important;
              --color-accent-fg: #e3de13 !important;
              --color-accent-emphasis: #e3de13 !important;
              --color-success-fg: #e3de13 !important;
              --color-attention-fg: #e3de13 !important;
              --color-severe-fg: #e3de13 !important;
              --color-done-fg: #e3de13 !important;
            }
            h2, h3, h4 { color: #e3de13 !important; }
            body { background-color: #111111 !important; }

      - name: Generate isometric commit calendar (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar-dark.svg
          committer_branch: output
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config: |
            theme: dark

      - name: Debug - what did the dark step produce?
        run: |
          echo "===== /metrics_renders ====="
          ls -la /metrics_renders/ || true
          echo "===== workspace root ====="
          ls -la $GITHUB_WORKSPACE/ || true
          echo "===== metrics SVGs anywhere ====="
          find $GITHUB_WORKSPACE -name 'metrics*.svg' -type f 2>/dev/null || true

      - name: Generate isometric commit calendar (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          committer_branch: output
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  recolor:
    needs: github-metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect hex colors in SVGs (debug)
        run: |
          echo "===== files present ====="
          ls -la
          echo "===== metrics.isocalendar-dark.svg ====="
          grep -oE '#[0-9a-fA-F]{6}' metrics.isocalendar-dark.svg 2>/dev/null | sort | uniq -c | sort -rn | head -20 || echo "FILE MISSING"
          echo "===== metrics.isocalendar.svg ====="
          grep -oE '#[0-9a-fA-F]{6}' metrics.isocalendar.svg 2>/dev/null | sort | uniq -c | sort -rn | head -20 || echo "FILE MISSING"

      - name: Recolor isocalendar SVGs to yellow palette
        run: |
          # ---- Dark version ----
          # Replace whichever greens exist; the -e patterns that don't match are harmless
          if [ -f metrics.isocalendar-dark.svg ]; then
            sed -i \
              -e 's/#161b22/#1a1a1a/g' \
              -e 's/#0e4429/#3e3c20/g' \
              -e 's/#006d32/#827f2b/g' \
              -e 's/#26a641/#b6b211/g' \
              -e 's/#39d353/#e3de13/g' \
              metrics.isocalendar-dark.svg

            # Dark mode text -> yellow
            sed -i \
              -e 's/#c9d1d9/#e3de13/g' \
              -e 's/#8b949e/#b6b211/g' \
              -e 's/#58a6ff/#e3de13/g' \
              -e 's/#ffffff/#e3de13/g' \
              metrics.isocalendar-dark.svg
          fi

          # ---- Light version ----
          if [ -f metrics.isocalendar.svg ]; then
            sed -i \
              -e 's/#9be9a8/#f7f5b5/g' \
              -e 's/#40c463/#efeb6a/g' \
              -e 's/#30a14e/#e3de13/g' \
              -e 's/#216e39/#8b8500/g' \
              metrics.isocalendar.svg

            # Light mode text -> black
            sed -i \
              -e 's/#959da5/#111111/g' \
              -e 's/#0366d6/#111111/g' \
              -e 's/#0969da/#111111/g' \
              -e 's/#0a3069/#111111/g' \
              -e 's/#54aeff/#111111/g' \
              -e 's/#b6e3ff/#111111/g' \
              -e 's/#24292e/#111111/g' \
              -e 's/#586069/#111111/g' \
              metrics.isocalendar.svg
          fi

      - name: Commit and push recolored SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=""
          [ -f metrics.isocalendar.svg ] && FILES="$FILES metrics.isocalendar.svg"
          [ -f metrics.isocalendar-dark.svg ] && FILES="$FILES metrics.isocalendar-dark.svg"

          if [ -z "$FILES" ]; then
            echo "No isocalendar files found to commit"
            exit 0
          fi

          git add $FILES

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Recolor isocalendar to yellow palette"
            git push origin output
          fi