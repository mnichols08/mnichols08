name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # ---------- MAIN METRICS (DARK) ----------
      - name: Generate main metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-dark.svg
          committer_branch: output
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          extras_css: |
            :root {
              --color-canvas-default: #111111 !important;
              --color-canvas-subtle: #1a1a1a !important;
              --color-border-default: #3e3c20 !important;
              --color-border-muted: #2a2a2a !important;
              --color-fg-default: #ffffff !important;
              --color-fg-muted: #b6b211 !important;
              --color-fg-subtle: #827f2b !important;
              --color-accent-fg: #e3de13 !important;
              --color-accent-emphasis: #e3de13 !important;
              --color-success-fg: #e3de13 !important;
              --color-attention-fg: #e3de13 !important;
              --color-severe-fg: #e3de13 !important;
              --color-done-fg: #e3de13 !important;
              --color-calendar-graph-day-L1-bg: #3e3c20 !important;
              --color-calendar-graph-day-L2-bg: #827f2b !important;
              --color-calendar-graph-day-L3-bg: #b6b211 !important;
              --color-calendar-graph-day-L4-bg: #e3de13 !important;
              --color-calendar-graph-day-bg: #1a1a1a !important;
            }
            h2, h3, h4 { color: #e3de13 !important; }
            body { background-color: #111111 !important; }

      # ---------- MAIN METRICS (LIGHT) ----------
      - name: Generate main metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_branch: output
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          extras_css: |
            :root {
              --color-canvas-default: #F5F4E6 !important;
              --color-canvas-subtle: #e8e6cf !important;
              --color-border-default: #827f2b !important;
              --color-border-muted: #c9c6a3 !important;
              --color-fg-default: #111111 !important;
              --color-fg-muted: #3a3814 !important;
              --color-fg-subtle: #55521e !important;
              --color-accent-fg: #111111 !important;
              --color-accent-emphasis: #111111 !important;
              --color-success-fg: #111111 !important;
              --color-attention-fg: #111111 !important;
              --color-severe-fg: #111111 !important;
              --color-done-fg: #111111 !important;
              --color-calendar-graph-day-L1-bg: #d8d6bd !important;
              --color-calendar-graph-day-L2-bg: #b6b211 !important;
              --color-calendar-graph-day-L3-bg: #827f2b !important;
              --color-calendar-graph-day-L4-bg: #4a4720 !important;
              --color-calendar-graph-day-bg: #ebe9d4 !important;
            }
            h2, h3, h4 { color: #111111 !important; }
            body { background-color: #F5F4E6 !important; color: #111111 !important; }
            text, tspan { fill: #111111 !important; }

      # ---------- ISOCALENDAR (DARK) ----------
      # Note: this plugin has no real theme option — both renders are
      # identical at this point. All dark/light differentiation happens
      # in the recolor job below.
      - name: Generate isometric commit calendar (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar-dark.svg
          committer_branch: output
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------- ISOCALENDAR (LIGHT) ----------
      - name: Generate isometric commit calendar (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          committer_branch: output
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  recolor:
    needs: github-metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recolor embedded graphics to yellow palette
        run: |
          python3 << 'PYEOF'
          import re, colorsys

          hex_re = re.compile(r'#([0-9a-fA-F]{6})\b')
          TARGET_H, _, _ = colorsys.rgb_to_hls(227/255, 222/255, 19/255)

          # ---- Small "contribution squares" row + language squares:
          #      exact swaps only, so language-bar brand colors stay untouched ----
          EXPLICIT_ONLY = {
              'metrics-dark.svg': {
                  '161b22': '1a1a1a',
                  '0e4429': '3e3c20',
                  '006d32': '827f2b',
                  '26a641': 'b6b211',
                  '39d353': 'e3de13',
              },
              'metrics.svg': {
                  'ebedf0': 'ebe9d4',
                  '9be9a8': 'f7f5b5',
                  '40c463': 'efeb6a',
                  '30a14e': 'e3de13',
                  '216e39': '8b8500',
              },
          }

          def classify_and_map(hexcode, theme):
              r = int(hexcode[0:2], 16) / 255
              g = int(hexcode[2:4], 16) / 255
              b = int(hexcode[4:6], 16) / 255
              h, l, s = colorsys.rgb_to_hls(r, g, b)

              if s < 0.03:
                  return None  # true neutral, background handled separately

              # Bright/vivid accent = heading text, streak icon, etc.
              is_bright_accent = (l >= 0.45 and s >= 0.55)

              if theme == 'light':
                  if is_bright_accent:
                      return '111111'  # yellow text -> black on cream
                  nr, ng, nb = colorsys.hls_to_rgb(TARGET_H, l, s)  # keep as-is (already fine)
              else:  # dark
                  if is_bright_accent:
                      return 'e3de13'  # keep vivid yellow, good on black
                  # cube shading: invert lightness so higher-activity
                  # (originally darker/more saturated) glows brighter on black
                  new_l = 1 - l
                  new_s = min(1.0, s * 1.15)
                  nr, ng, nb = colorsys.hls_to_rgb(TARGET_H, new_l, new_s)

              return '{:02x}{:02x}{:02x}'.format(round(nr*255), round(ng*255), round(nb*255))

          # ---- Isocalendar files: background explicit swap + generic classify ----
          ISOCAL = {
              'metrics.isocalendar-dark.svg': ('dark', '1a1a1a'),
              'metrics.isocalendar.svg': ('light', 'f5f4e6'),
          }

          for fname, (theme, bg_target) in ISOCAL.items():
              try:
                  with open(fname, 'r', encoding='utf-8') as f:
                      content = f.read()
              except FileNotFoundError:
                  print(f"skip missing {fname}")
                  continue

              content = re.sub(r'(?i)#f0f0eb', '#' + bg_target, content)

              colors = set(m.group(1).lower() for m in hex_re.finditer(content))
              mapping = {}
              for hexcode in colors:
                  new_hex = classify_and_map(hexcode, theme)
                  if new_hex and new_hex != hexcode:
                      mapping[hexcode] = new_hex

              for old, new in mapping.items():
                  content = re.sub(r'(?i)#' + old, '#' + new, content)

              with open(fname, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"{fname}: bg->{bg_target}, {len(mapping)} colors remapped")

          # ---- metrics.svg / metrics-dark.svg: exact swaps only ----
          for fname, explicit_map in EXPLICIT_ONLY.items():
              try:
                  with open(fname, 'r', encoding='utf-8') as f:
                      content = f.read()
              except FileNotFoundError:
                  print(f"skip missing {fname}")
                  continue

              for old, new in explicit_map.items():
                  content = re.sub(r'(?i)#' + old, '#' + new, content)

              with open(fname, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"{fname}: {len(explicit_map)} explicit swaps")
          PYEOF

      - name: Commit and push recolored SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=""
          [ -f metrics.svg ] && FILES="$FILES metrics.svg"
          [ -f metrics-dark.svg ] && FILES="$FILES metrics-dark.svg"
          [ -f metrics.isocalendar.svg ] && FILES="$FILES metrics.isocalendar.svg"
          [ -f metrics.isocalendar-dark.svg ] && FILES="$FILES metrics.isocalendar-dark.svg"

          if [ -z "$FILES" ]; then
            echo "No files found to commit"
            exit 0
          fi

          git add $FILES

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Recolor embedded graphics to yellow palette"
            git push origin output
          fi