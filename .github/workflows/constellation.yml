# Save as .github/workflows/constellation.yml
# Base look lives in constellation.config.json; scripts/daily-design.mjs picks each day's sky (US Eastern).
# The tech stack images are drawn by Constellation, matched to today's palette (light and dark) and given a small daily motion by
# scripts/style-tech.mjs, and published beside it for the README's Tech stack section.
# The banners in assets/ are re-hued to the same palette (scripts/recolor-banner.mjs), and the README's
# third-party images (typing banner, badges, streak card) are refetched in it (scripts/readme-art.mjs).
name: Daily constellation
on:
  schedule:
    - cron: '0 5 * * *'  # midnight EST (1am EDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: constellation-output
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick today's sky
        run: node scripts/daily-design.mjs --out constellation.today.json
      - name: Draw the constellation
        uses: mnichols08/constellation@v3
        with:
          publish: 'true'
          config: constellation.today.json
      - name: Draw the tech stack card
        uses: mnichols08/constellation@v5
        with:
          tech-stack: 'true'
          tech-stack-style: card
          output: tech-stack.svg
      - name: Draw the tech stack map
        uses: mnichols08/constellation@v5
        with:
          tech-stack: 'true'
          tech-stack-style: map
          output: tech-stack-map.svg
      - name: Match today's palette and motion
        run: |
          node scripts/style-tech.mjs tech-stack.svg --kind card
          node scripts/style-tech.mjs tech-stack-map.svg --kind map
      - name: Re-hue the banners
        run: |
          node scripts/recolor-banner.mjs assets/banner-dark.png banner-dark.png
          node scripts/recolor-banner.mjs assets/banner-light.png banner-light.png
      - name: Fetch README images in today's palette
        run: node scripts/readme-art.mjs art
      - name: Publish tech stack images, banners and README art
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/output"
            git fetch --no-tags origin output
            git worktree add --detach "$RUNNER_TEMP/output" FETCH_HEAD
            cp tech-stack.svg tech-stack-map.svg banner-dark.png banner-light.png "$RUNNER_TEMP/output/"
            cp art/*.svg "$RUNNER_TEMP/output/" 2>/dev/null || echo "No README art fetched; keeping the last published copies."
            (
              cd "$RUNNER_TEMP/output"
              git add --all
              if git diff --cached --quiet; then echo "Images unchanged."; exit 0; fi
              git commit -m "Update tech stack images, banners and README art"
              git push origin HEAD:refs/heads/output
            ) && break
            git worktree remove --force "$RUNNER_TEMP/output"
            echo "Push raced with another update; retrying ($attempt/3)."
            sleep 5
          done
