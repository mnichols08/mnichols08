# Save as .github/workflows/constellation.yml
# Generated by GitHub Constellation. Settings and CSS match the preview.
name: Daily constellation
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: constellation-output
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mnichols08/constellation@main
        with:
          username: 'mnichols08'
          token: ${{ secrets.GITHUB_TOKEN }}
          output: constellation.svg
          publish: 'true'
          output-branch: output
          config-json: |
            {
              "layout": "compact",
              "title": "mnix / a small universe of code",
              "animate": true,
              "maxRepos": 24,
              "includeForks": false,
              "connectionDensity": "all",
              "bridges": false,
              "showOther": false,
              "includeRepos": [
                "drawer-count-app",
                "kitchen-inventory-app",
                "ctd-react-v3-final",
                "ctd-react-v3-guided-project",
                "web-components",
                "WebComponentAccesibility",
                "wcl",
                "breather",
                "tick-it",
                "rust-swing-or-cast",
                "open.CRM",
                "banking-app"
              ],
              "theme": "auto",
              "css": "/* Visual controls: light palette, then the viewer’s dark preference. */\nsvg {\n  --sky-background: #F5F4E6;\n  --sky-foreground: #111111;\n  --sky-accent: #827F2B;\n  --sky-line: #AAA66D;\n  --sky-star: #827F2B;\n}\n@media (prefers-color-scheme: dark) {\n  svg {\n    --sky-background: #111111;\n    --sky-foreground: #FFFFFF;\n    --sky-accent: #E3DE13;\n    --sky-line: #77743B;\n    --sky-star: #E3DE13;\n  }\n}\n.connections { stroke-width: 0.9; opacity: 0.8; }\n.shared-language[data-emphasis=\"secondary\"] { opacity: 0.13; }\n.bridges { stroke-width: 0.9; opacity: 0.35; }\n.star { filter: drop-shadow(0 0 1.5px var(--sky-star)); }\n.dust { opacity: 0.35; }\n.language text, .repo-label { font-size: 11px; }\n.language, .repo-label { display: inline; }\n.star-halo { opacity: .06; }\n.repo-label { opacity: .8; }\n.credit { opacity: .8; }"
            }
