name: Generate Snake

on:
  schedule:
    - cron: "0 5 * * *"  # midnight EST (1am EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Same palette the constellation uses today (scripts/palette.mjs).
      - name: Pick today's palette
        id: palette
        run: node scripts/palette.mjs github-output

      - name: Generate Animated Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mnichols08
          outputs: ${{ steps.palette.outputs.snake_outputs }}

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          keep_history: true
          build_dir: dist
          commit_message: "Deploy Snake to Output Branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}